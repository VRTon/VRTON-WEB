# Jekyll Configuration for GitHub Pages
# This enables clean URLs without .html extensions

# Site settings
title: "VRTon - Realidad Virtual para Causas Solidarias"
description: "Organización sin ánimo de lucro que utiliza realidad virtual para crear impacto social positivo. Apoyamos la Teletón Chile 2025. Únete a nuestra comunidad VR solidaria."
url: "https://vrton.org"
baseurl: ""

# Keywords for SEO
keywords: "realidad virtual, VR, organización sin lucro, cambio social, educación inmersiva, terapias VR, tecnología social, impacto positivo, causas solidarias, Teletón Chile, VRChat, eventos solidarios, recaudación fondos, discapacidad, rehabilitación, VRTon 2025"

# Open Graph default image
image: "/assets/icons/icon-512x512.webp"

# Permalink structure (removes .html)
permalink: pretty

# Enable clean URLs
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Custom plugins directory
plugins_dir: _plugins

# Exclude files from processing
exclude:
  - README.md
  - LICENSE
  - CONTRIBUTING.md
  - node_modules/
  - .git/
  - .vscode/
  - package.json
  - package-lock.json
  - "*.ps1"
  - data/vpm-listing.json

# Include files
include:
  - .htaccess

# Collections (if needed for blog posts later)
collections_dir: collections

# SEO settings
lang: es
author: VRTon
locale: es_ES

# Twitter settings
twitter:
  username: vrtonof
  card: summary_large_image

# Social media profiles
social:
  name: VRTon
  links:
    - https://x.com/vrtonof
    - https://www.instagram.com/vrtonof/
    - https://www.youtube.com/@VRTonOficial
    - https://discord.gg/AR72D2nfpp
    - https://www.tiktok.com/@vrtonoficial
    - https://www.twitch.tv/vrtonof

# Default values for all pages
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      image: "/assets/icons/icon-512x512.webp"
      author: "VRTon"
      lang: "es"

# GitHub Pages specific settings
github: [metadata]

# 404 Page Configuration
404:
  enabled: true
  path: "/404.html"

# Build settings for GitHub Pages
markdown: kramdown
highlighter: rouge

# Ensure 404 page is processed
