---
layout: default
---

<div class="legal-document-container" data-translation-modules="{{ page.translation_modules | join: ',' }}">
    <!-- Document Header -->
    <div class="legal-header">
        <div class="container">
            <h1 class="legal-title" data-i18n="{{ page.title_key }}">{{ page.title }}</h1>
            <p class="legal-subtitle" data-i18n="{{ page.subtitle_key }}">{{ page.subtitle }}</p>
            <div class="legal-meta">
                <span class="last-updated" data-i18n="legal.lastUpdated">Última actualización:</span>
                <time datetime="{{ page.last_updated | default: site.time | date_to_xmlschema }}">
                    {{ page.last_updated | default: site.time | date: "%d de %B de %Y" }}
                </time>
            </div>
        </div>
    </div>

    <!-- Main Layout with Sidebar -->
    <div class="legal-main-layout">
        <!-- Sidebar Table of Contents -->
        {% if page.show_toc != false %}
        <aside class="legal-sidebar" id="legalSidebar">
            <div class="sidebar-content">
                <nav class="legal-toc" id="tableOfContents">
                    <h2 class="toc-title" data-i18n="legal.tableOfContents">Tabla de Contenidos</h2>
                    <div class="toc-content" id="tocContent">
                        <!-- TOC will be generated by JavaScript -->
                    </div>
                </nav>
            </div>
            <!-- Mobile toggle button -->
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Mostrar/Ocultar tabla de contenidos">
                <i class="fas fa-bars"></i>
            </button>
        </aside>
        {% endif %}

        <!-- Document Content -->
        <div class="legal-content">
            <article class="legal-article">
                {{ content }}
            </article>
        </div>
    </div>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop" aria-label="Volver arriba">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- Sidebar Styles -->
    <style>
        /* Ensure content starts after fixed header */
        .legal-document-container {
            padding-top: var(--header-height);
        }

        .legal-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 0;
            margin-bottom: 0;
        }

        .legal-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .legal-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 1rem;
        }

        .legal-meta {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .legal-main-layout {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            gap: 2rem;
            padding: 2rem 1rem;
            min-height: calc(100vh - 200px);
        }

        .legal-sidebar {
            position: sticky;
            top: calc(var(--header-height) + 20px);
            width: 300px;
            min-width: 300px;
            height: fit-content;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .sidebar-content {
            padding: 1.5rem;
        }

        .legal-toc .toc-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e74c3c;
        }

        .toc-content .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex !important;
            flex-direction: column !important;
            grid-template-columns: none !important;
            gap: 0 !important;
        }

        .toc-content .toc-list li {
            margin-bottom: 0.5rem;
            display: block !important;
            width: 100% !important;
        }

        .toc-content .toc-subsection {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 0 0;
            border-left: 2px solid #e9ecef;
            padding-left: 0.75rem;
            display: flex !important;
            flex-direction: column !important;
            width: 100%;
            grid-template-columns: none !important;
            gap: 0 !important;
        }

        .toc-content .toc-subsection li {
            margin-bottom: 0.25rem;
            display: block !important;
            width: 100% !important;
        }

        .toc-content .toc-list a {
            color: #495057;
            text-decoration: none;
            display: block;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .toc-content .toc-list a:hover {
            background-color: #e74c3c;
            color: white;
            transform: translateX(4px);
        }

        .toc-content .toc-list a.active {
            background-color: #e74c3c;
            color: white;
            font-weight: 500;
        }

        .toc-level-2 a {
            padding-left: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
        }

        .toc-level-2 a:hover,
        .toc-level-2 a.active {
            background-color: #e74c3c;
            border-color: #e74c3c;
        }

        .toc-level-3 a {
            padding-left: 0.75rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .toc-level-4 a {
            padding-left: 0.5rem;
            font-size: 0.8rem;
            color: #6c757d;
            font-weight: 400;
        }

        .toc-level-4 a:hover {
            background-color: #dc3545;
            color: white;
        }

        /* Expand/collapse functionality for H3 sections */
        .toc-level-3 {
            position: relative;
        }

        .toc-level-3 > a {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toc-toggle-btn {
            background: none;
            border: none;
            color: inherit;
            font-size: 0.7rem;
            padding: 0.25rem;
            border-radius: 3px;
            transition: all 0.2s ease;
            cursor: pointer;
            opacity: 0.7;
        }

        .toc-toggle-btn:hover {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .toc-level-3.collapsed .toc-subsection {
            display: none;
        }

        /* Visual hierarchy improvements */
        .toc-subsection {
            background-color: #f8f9fa;
            border-radius: 0 4px 4px 0;
            margin-top: 0.25rem;
        }

        .toc-subsection li:last-child {
            margin-bottom: 0;
        }

        .legal-content {
            flex: 1;
            min-width: 0;
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .sidebar-toggle {
            display: none;
            position: fixed;
            top: calc(var(--header-height) + 20px);
            left: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .sidebar-toggle:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .legal-document-container {
                padding-top: var(--header-height-mobile);
            }

            .sidebar-toggle {
                top: calc(var(--header-height-mobile) + 20px);
            }

            .legal-main-layout {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .legal-sidebar {
                position: fixed;
                top: 0;
                left: -320px;
                width: 320px;
                height: 100vh;
                background: white;
                border-radius: 0;
                border-right: 1px solid #e9ecef;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
                transition: left 0.3s ease;
                overflow-y: auto;
                z-index: 1001;
            }

            .legal-sidebar.active {
                left: 0;
            }

            .sidebar-content {
                padding: 2rem 1.5rem;
                padding-top: calc(var(--header-height-mobile) + 20px);
            }

            .sidebar-toggle {
                display: block;
            }

            .legal-content {
                margin: 0;
                border-radius: 8px;
                padding: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            .legal-main-layout {
                padding: 0.5rem;
            }

            .legal-content {
                padding: 1rem;
            }

            .sidebar-content {
                padding: 1.5rem 1rem;
                padding-top: calc(var(--header-height-mobile) + 20px);
            }
        }

        /* Overlay for mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        @media (max-width: 1024px) {
            .sidebar-overlay.active {
                display: block;
            }
        }
    </style>

    <!-- Sidebar Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Print Styles -->
    <style media="print">
        .legal-sidebar,
        .sidebar-toggle,
        .back-to-top,
        header,
        footer,
        .loading-screen,
        .maintenance-modal {
            display: none !important;
        }
        
        .legal-main-layout {
            display: block !important;
            padding: 0 !important;
            margin: 0 !important;
        }
        
        .legal-content {
            padding: 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
        }
        
        .legal-article {
            font-size: 12pt !important;
            line-height: 1.4 !important;
        }
        
        .legal-section {
            break-inside: avoid !important;
        }
    </style>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Sidebar toggle functionality
    setupSidebarToggle();
    
    // Back to top functionality
    setupBackToTop();
    
    // Smooth scroll for anchor links
    setupSmoothScroll();
    
    // Active link highlighting
    setupActiveHighlighting();
    
    // Initialize table of contents when i18n is ready
    if (typeof window.onI18nReady === 'undefined') {
        window.onI18nReady = initializeLegalDocument;
    } else {
        const originalCallback = window.onI18nReady;
        window.onI18nReady = function() {
            if (typeof originalCallback === 'function') {
                originalCallback();
            }
            initializeLegalDocument();
        };
    }
    
    // If i18n is already ready, initialize immediately
    if (window.isI18nReady && window.isI18nReady()) {
        initializeLegalDocument();
    }
    
    // Add observer for language changes
    if (window.i18nV3) {
        window.i18nV3.addObserver((language) => {
            console.log(`🔄 Language changed to ${language}, regenerating table of contents...`);
            setTimeout(() => {
                if (document.getElementById('tableOfContents')) {
                    generateTableOfContents();
                }
            }, 500); // Wait for translations to be applied
        });
    }
});

function initializeLegalDocument() {
    // Generate Table of Contents after translations are loaded
    if (document.getElementById('tableOfContents')) {
        generateTableOfContents();
    }
}

function generateTableOfContents() {
    const tocContent = document.getElementById('tocContent');
    const headings = document.querySelectorAll('.legal-article h2, .legal-article h3, .legal-article h4');
    
    if (!tocContent || headings.length === 0) return;
    
    let tocHTML = '<ul class="toc-list">';
    let currentH3 = null;
    let h4List = [];
    
    headings.forEach((heading, index) => {
        const level = parseInt(heading.tagName.charAt(1));
        const id = heading.id || `heading-${index}`;
        
        // Get translated text content
        let text = heading.textContent;
        const i18nKey = heading.getAttribute('data-i18n');
        if (i18nKey && window.i18nV3 && window.i18nV3.translations) {
            const translatedText = window.i18nV3.translations[i18nKey];
            if (translatedText) {
                text = translatedText;
            }
        }
        
        if (!heading.id) {
            heading.id = id;
        }
        
        if (level === 2) {
            // H2 - Main sections
            tocHTML += `<li class="toc-level-2"><a href="#${id}" class="toc-link">${text}</a></li>`;
        } else if (level === 3) {
            // H3 - Close previous H3 section if exists
            if (currentH3 && h4List.length > 0) {
                tocHTML += '<ul class="toc-subsection">';
                h4List.forEach(h4 => {
                    tocHTML += `<li class="toc-level-4"><a href="#${h4.id}" class="toc-link">${h4.text}</a></li>`;
                });
                tocHTML += '</ul></li>';
                h4List = [];
            }
            
            // Start new H3 section
            currentH3 = { id, text };
            tocHTML += `<li class="toc-level-3"><a href="#${id}" class="toc-link">${text}</a>`;
        } else if (level === 4 && currentH3) {
            // H4 - Add to current H3 section
            h4List.push({ id, text });
        }
    });
    
    // Close final H3 section if exists
    if (currentH3 && h4List.length > 0) {
        tocHTML += '<ul class="toc-subsection">';
        h4List.forEach(h4 => {
            tocHTML += `<li class="toc-level-4"><a href="#${h4.id}" class="toc-link">${h4.text}</a></li>`;
        });
        tocHTML += '</ul>';
    }
    
    // Close any remaining open li
    if (currentH3) {
        tocHTML += '</li>';
    }
    
    tocHTML += '</ul>';
    tocContent.innerHTML = tocHTML;
    
    // Add click handlers for H3 sections to toggle subsections
    setupTocCollapseToggle();
}

function setupTocCollapseToggle() {
    const h3Items = document.querySelectorAll('.toc-level-3');
    
    h3Items.forEach(item => {
        const link = item.querySelector('> a');
        const subsection = item.querySelector('.toc-subsection');
        
        if (subsection && link) {
            // Create a toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'toc-toggle-btn';
            toggleBtn.setAttribute('aria-label', 'Expandir/Colapsar subsección');
            toggleBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
            
            // Insert toggle button into the link
            link.appendChild(toggleBtn);
            
            // Handle toggle button click
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                item.classList.toggle('collapsed');
                
                // Update icon
                const icon = toggleBtn.querySelector('i');
                if (item.classList.contains('collapsed')) {
                    icon.className = 'fas fa-chevron-right';
                } else {
                    icon.className = 'fas fa-chevron-down';
                }
            });
            
            // Initially collapse if there are many subsections
            if (subsection.children.length > 3) {
                item.classList.add('collapsed');
                toggleBtn.querySelector('i').className = 'fas fa-chevron-right';
            }
        }
    });
}

function setupBackToTop() {
    const backToTopBtn = document.getElementById('backToTop');
    
    if (!backToTopBtn) return;
    
    window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
            backToTopBtn.classList.add('visible');
        } else {
            backToTopBtn.classList.remove('visible');
        }
    });
    
    backToTopBtn.addEventListener('click', function() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
}

function setupSidebarToggle() {
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('legalSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    
    if (!sidebarToggle || !sidebar) return;
    
    // Toggle sidebar
    sidebarToggle.addEventListener('click', function() {
        sidebar.classList.toggle('active');
        if (overlay) {
            overlay.classList.toggle('active');
        }
    });
    
    // Close sidebar when clicking overlay
    if (overlay) {
        overlay.addEventListener('click', function() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });
    }
    
    // Close sidebar when clicking a link (mobile)
    const tocLinks = document.querySelectorAll('.toc-link');
    tocLinks.forEach(link => {
        link.addEventListener('click', function() {
            if (window.innerWidth <= 1024) {
                sidebar.classList.remove('active');
                if (overlay) {
                    overlay.classList.remove('active');
                }
            }
        });
    });
}

function setupSmoothScroll() {
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                // Get header height dynamically
                const headerHeight = getComputedStyle(document.documentElement)
                    .getPropertyValue('--header-height').trim();
                const headerHeightMobile = getComputedStyle(document.documentElement)
                    .getPropertyValue('--header-height-mobile').trim();
                
                const isMobile = window.innerWidth <= 768;
                const offset = isMobile ? 
                    parseInt(headerHeightMobile) + 20 : 
                    parseInt(headerHeight) + 20;
                
                const targetPosition = target.offsetTop - offset;
                
                window.scrollTo({
                    top: targetPosition,
                    behavior: 'smooth'
                });
            }
        });
    });
}

function setupActiveHighlighting() {
    const tocLinks = document.querySelectorAll('.toc-link');
    const headings = document.querySelectorAll('.legal-article h2, .legal-article h3, .legal-article h4');
    
    if (tocLinks.length === 0 || headings.length === 0) return;
    
    function updateActiveLink() {
        let activeHeading = null;
        // Get header height dynamically
        const headerHeight = getComputedStyle(document.documentElement)
            .getPropertyValue('--header-height').trim();
        const headerHeightMobile = getComputedStyle(document.documentElement)
            .getPropertyValue('--header-height-mobile').trim();
        
        const isMobile = window.innerWidth <= 768;
        const offset = isMobile ? 
            parseInt(headerHeightMobile) + 50 : 
            parseInt(headerHeight) + 50;
        
        const scrollPosition = window.pageYOffset + offset;
        
        // Find the current heading
        headings.forEach(heading => {
            if (heading.offsetTop <= scrollPosition) {
                activeHeading = heading;
            }
        });
        
        // Remove active class from all links
        tocLinks.forEach(link => link.classList.remove('active'));
        
        // Add active class to current link
        if (activeHeading) {
            const activeLink = document.querySelector(`a[href="#${activeHeading.id}"]`);
            if (activeLink) {
                activeLink.classList.add('active');
            }
        }
    }
    
    // Update on scroll
    window.addEventListener('scroll', updateActiveLink);
    
    // Initial update
    updateActiveLink();
}
</script>
