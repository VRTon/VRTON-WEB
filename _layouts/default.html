<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'es' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags - Generated by Jekyll SEO Tag -->
    {% seo %}
    
    <!-- Head Meta Tags, Favicons, and Resource Hints -->
    {% include head-meta.html %}
    
    <!-- Styles -->
    {% include styles.html %}
</head>
<body class="loading"{% if page.translation_modules %} data-translation-modules="{{ page.translation_modules | join: ',' }}"{% endif %}>
    <!-- Loading Screen -->
    {% include loading.html %}

    <!-- Header -->
    {% include header.html %}

    <!-- Main Content -->
    <main>
        {{ content }}
    </main>

    <!-- Footer -->
    {% include footer.html %}
    
    <!-- Ventana Mantenimiento -->
    {% include maintenance-modal.html %}

    <!-- Scripts -->
    {% include scripts.html %}
    
    <!-- Page-specific translation initialization -->
    {% if page.translation_modules %}
    <script>
        // Especificar módulos de traducción para esta página
        window.requiredTranslationModules = {{ page.translation_modules | jsonify }};
    </script>
    {% endif %}
</body>
</html>
