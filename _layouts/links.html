<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'es' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags - Generated by Jekyll SEO Tag -->
    {% seo %}
    
    <!-- Head Meta Tags, Favicons, and Resource Hints -->
    {% include head-meta.html %}
    
    <!-- Styles -->
    {% include styles.html %}
    
    <!-- Custom styles for links layout -->
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(227, 6, 19, 0.9) 0%, rgba(253, 92, 99, 0.8) 100%),
                        url('/assets/comunidad.webp') center/cover no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .links-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem 1rem;
            position: relative;
            z-index: 2;
        }
        
        /* Background overlay for better readability */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        
        /* Ensure content is above overlay */
        .links-container > * {
            position: relative;
            z-index: 3;
        }
        
        /* Override any existing styles that might interfere */
        header, nav, footer {
            display: none !important;
        }
        
        /* Loading screen override */
        .loading {
            background: linear-gradient(135deg, rgba(227, 6, 19, 0.9) 0%, rgba(253, 92, 99, 0.8) 100%),
                        url('/assets/comunidad.webp') center/cover no-repeat !important;
        }
        
        /* Hide loading screen faster for links page */
        .loading-screen {
            transition: opacity 0.5s ease-out;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .links-container {
                padding: 1rem 0.5rem;
                max-width: 95%;
            }
            
            body {
                background-attachment: scroll; /* Better performance on mobile */
            }
        }
        
        @media (max-height: 600px) {
            body {
                align-items: flex-start;
                padding-top: 2rem;
            }
            
            .links-container {
                margin-top: 0;
            }
        }
    </style>
</head>
<body class="loading links-page">
    <!-- Loading Screen (simplified for links page) -->
    <div class="loading-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(227, 6, 19, 0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease-out;">
        <div style="text-align: center; color: white;">
            <i class="fas fa-link" style="font-size: 3rem; margin-bottom: 1rem; animation: pulse 2s infinite;"></i>
            <p style="font-size: 1.2rem; margin: 0;" data-i18n="loading.preparing">Preparando enlaces...</p>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="links-container">
        {{ content }}
    </div>

    <!-- Scripts -->
    {% include scripts.html %}
    
    <!-- Custom script for links page -->
    <script>
        // Faster loading for links page
        document.addEventListener('DOMContentLoaded', function() {
            // Hide loading screen quickly
            setTimeout(() => {
                const loadingScreen = document.querySelector('.loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        document.body.classList.remove('loading');
                    }, 500);
                }
            }, 500);
            
            // Add click tracking for analytics (if needed)
            const linkButtons = document.querySelectorAll('.link-button');
            linkButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const platform = this.querySelector('.link-text').textContent;
                    console.log(`Clicked on ${platform} link`);
                    
                    // You can add analytics tracking here
                    if (typeof gtag !== 'undefined') {
                        gtag('event', 'click', {
                            event_category: 'social_links',
                            event_label: platform
                        });
                    }
                });
            });
        });
        
        // Add pulse animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.1); opacity: 0.8; }
                100% { transform: scale(1); opacity: 1; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
