name: PR Build Check

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Build the site in the jekyll/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
    
    - name: Check build artifacts
      run: |
        if [ -d "_site" ] && [ "$(ls -A _site)" ]; then
          echo "✅ Build successful - _site directory contains files"
          ls -la _site/
        else
          echo "❌ Build failed - _site directory is empty or missing"
          exit 1
        fi
    
    - name: Comment on PR
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const buildSuccess = fs.existsSync('_site') && fs.readdirSync('_site').length > 0;
          
          const comment = buildSuccess 
            ? '✅ **Build Status: SUCCESS**\n\nThe Jekyll site built successfully! The pull request is ready for review.'
            : '❌ **Build Status: FAILED**\n\nThe Jekyll site failed to build. Please check the workflow logs for details.';
            
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });